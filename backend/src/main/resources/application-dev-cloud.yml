spring:
  datasource:
    url: jdbc:postgresql:///mislice?socketFactory=com.google.cloud.sql.postgres.SocketFactory&cloudSqlInstance=xx-1-2e007:us-central1:mislice-db
    username: postgres
    password: mislicepassword123
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Redis and mail servers are optional in local dev — don't fail the health check without them.
management:
  health:
    redis:
      enabled: false
    mail:
      enabled: false

logging:
  level:
    com.mislice: DEBUG
    org.hibernate.SQL: DEBUG
