spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Redis and mail servers are optional in local dev — don't fail the health check without them.
management:
  health:
    redis:
      enabled: false
    mail:
      enabled: false

logging:
  level:
    com.mislice: DEBUG
    org.hibernate.SQL: DEBUG
